name = "cueme-song-search"
main = "src/index.ts"
compatibility_date = "2026-08-31"

[observability]
enabled = true

# Everything below is set as a Worker secret (Dashboard > Workers & Pages >
# cueme-song-search > Settings > Variables and Secrets), never committed
# here — see SETUP.txt for the exact steps and names:
#   APP_SHARED_SECRET             shared secret the app must send back,
#                                 stops a stranger who finds the URL from
#                                 running up the community Dropbox account's
#                                 API usage
#   COMMUNITY_DROPBOX_REFRESH_TOKEN
#                                 long-lived Dropbox refresh token for the
#                                 shared community library account
#                                 (rusty@yourblindally.com, separate from
#                                 Rusty's own personal Dropbox) — obtained
#                                 via docs/reveal-token.html, see
#                                 "chordpro songs/project notes.txt" Step 10
#                                 in the LyriCue - audio prompter folder for
#                                 the full story
#
# 2026-09-15: replaced the earlier AI-web-search version of this Worker
# (Gemini/Anthropic/OpenAI grounding search) with a search over the curated
# community song library instead — the AI version's real-world success rate
# was low even after real tuning work, and a real curated library search is
# both more reliable and (per Rusty's explicit request) not something the
# app advertises as "Dropbox" anywhere in its UI, just "Search".
